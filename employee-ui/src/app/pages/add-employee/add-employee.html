<div class="card">
	<div class="card-header">
		<h1 class="h4 mb-0">{{ employeeId === null ? 'Add Employee' : 'Edit Employee' }}</h1>
	</div>
	<div class="card-body">
		<form #employeeForm="ngForm" (ngSubmit)="saveEmployee()">
			<div class="mb-3">
				<label class="form-label" for="name">Name</label>
				<input id="name" name="name" class="form-control" required
					[(ngModel)]="employee.name">
			</div>
			<div class="mb-3">
				<label class="form-label" for="department">Department</label>
				<input id="department" name="department" class="form-control" required
					[(ngModel)]="employee.department">
			</div>
			<div class="mb-3">
				<label class="form-label" for="email">Email</label>
				<input id="email" name="email" type="email" class="form-control" required email
					[(ngModel)]="employee.email">
			</div>
			<button class="btn btn-primary me-2" type="submit"
				[disabled]="employeeForm.invalid || isSaving">
				{{ isSaving ? 'Saving...' : (employeeId === null ? 'Add Employee' : 'Update Employee') }}
			</button>
			<a class="btn btn-secondary" routerLink="/employees">Cancel</a>
		</form>
	</div>
</div>
